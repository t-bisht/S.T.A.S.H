spring:
  application:
    name: user-engine
  datasource:
    url:      ${STASH_DB_URL:jdbc:postgresql://localhost:7432/stash}
    username: ${STASH_DB_USER:stash}
    password: ${STASH_DB_PASSWORD:pwd}

server:
  port: 7083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Shared secret guarding user_engine's /internal/** token endpoints (spec 02): inbound, presented by
# Stash backend engines. Distinct from the outbound Hiemdall token below — different trust boundary,
# rotated independently. Startup fails if blank (@NotBlank).
internal-auth:
  svc-token: ${INTERNAL_SVC_TOKEN:}

hiemdall:
  base-url:       ${HIEMDALL_BASE_URL:http://localhost:9082}
  app-id:         ${HIEMDALL_APP_ID:stash}
  internal-token: ${HIEMDALL_INTERNAL_TOKEN:}
  exchange-path:  /internal/auth/exchange
  refresh-path:   /internal/auth/google/refresh

session:
  cookie-name: STASH_SESSION
  ttl:         P10D
  same-site:   Lax
  secure:      true
  http-only:   true

tokens:
  enc-key: ${STASH_TOKEN_ENC_KEY:}

cors:
  allowed-origins: ${VITE_USER_ENGINE_BASE_URL:http://localhost:5173}

# Google access-token refresh. Remaining keys (interval, refresh-window, page-size,
# coalesce-window, lock-wait, initial-delay, min-validity) default in TokenRefreshProperties.
token-refresh:
  enabled: ${TOKEN_REFRESH_ENABLED:true}   # false disables the scheduled sweep only
  min-validity: PT2M                        # spec 02: engines never get a token with less life left
