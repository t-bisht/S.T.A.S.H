# Stash — local dev compose.
#
# Run from repo root:  docker compose -f infra/docker-compose.yml up --build
#
# Build contexts are relative to this file (infra/), so most services set
# `context: ..` (repo root) to reach py/, java/, web/ trees.
#
# Prereq for login_engine: build the fat JAR first —
#   (cd java && ./gradlew :login_engine:bootJar)

name: stash

services:
  postgres:
    image: postgres:16-alpine
    container_name: stash-postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-stash}
      POSTGRES_USER:     ${POSTGRES_USER:-stash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stash}
    ports:
      - "5432:5432"
    volumes:
      - stash-pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stash}"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - stash-net

  ingestion:
    build:
      context: ..
      dockerfile: py/ingestion/Dockerfile
    container_name: stash-ingestion
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${POSTGRES_DB:-stash}
      DB_USER:     ${POSTGRES_USER:-stash}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-stash}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stash-net

  stager:
    build:
      context: ..
      dockerfile: py/stager/Dockerfile
    container_name: stash-stager
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${POSTGRES_DB:-stash}
      DB_USER:     ${POSTGRES_USER:-stash}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-stash}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stash-net

  login_engine:
    build:
      context: ../java/login_engine
      dockerfile: Dockerfile
    container_name: stash-login-engine
    environment:
      DB_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stash}
      DB_USER:     ${POSTGRES_USER:-stash}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-stash}
      GOOGLE_CLIENT_ID:         ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET:     ${GOOGLE_CLIENT_SECRET:-}
      APP_OAUTH_REDIRECT_URI:   ${APP_OAUTH_REDIRECT_URI:-http://localhost:3000/api/auth/google/callback}
      APP_JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
      APP_JWT_ACTIVE_KID:       ${APP_JWT_ACTIVE_KID:-v1}
      APP_JWT_ISSUER:           ${APP_JWT_ISSUER:-auth_engine}
      APP_TOKEN_ENC_KEY:        ${APP_TOKEN_ENC_KEY:-}
      INTERNAL_SVC_TOKEN:       ${INTERNAL_SVC_TOKEN:-dev-internal-token-change-me}
      CORS_ALLOWED_ORIGINS:     ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ../infra/secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stash-net

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: stash-web
    environment:
      API_BASE_URL:     /api
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:80"
    depends_on:
      - login_engine
      - ingestion
      - stager
    networks:
      - stash-net

networks:
  stash-net:
    driver: bridge

volumes:
  stash-pg-data:
