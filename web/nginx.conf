# nginx server block for the stash-web SPA.
#
# Topology (docker-compose):
#   Browser → nginx:80
#             ├─ /api/**  → stash-user-engine:7083 (/api/ prefix stripped on forward)
#             ├─ /env.js  → runtime-config file written by docker-entrypoint.sh
#             └─ /*       → index.html (SPA fallback)
#
# Lazy DNS: resolver + variable proxy_pass defers upstream resolution to
# request-time instead of startup-time. Lets the container boot standalone
# (e.g. for /env.js smoke-tests) even when the upstream service isn't up yet.

# 127.0.0.11 is Docker's embedded DNS on user-defined networks (compose).
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $stash_user_engine "stash-user-engine";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://$stash_user_engine:7083;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # env.js regenerated on every container start — never cache.
    location = /env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
